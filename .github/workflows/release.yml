# Builds `oxilite studio-server` for each platform and packages a platform-specific VSIX with it.
name: package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      oxilite_ref:
        description: oxilite git ref to build the server from
        default: main

jobs:
  vsix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rust: aarch64-apple-darwin, vsce: darwin-arm64, exe: oxilite }
          - { os: macos-13, rust: x86_64-apple-darwin, vsce: darwin-x64, exe: oxilite }
          - { os: ubuntu-latest, rust: x86_64-unknown-linux-gnu, vsce: linux-x64, exe: oxilite }
          - { os: ubuntu-24.04-arm, rust: aarch64-unknown-linux-gnu, vsce: linux-arm64, exe: oxilite }
          - { os: windows-latest, rust: x86_64-pc-windows-msvc, vsce: win32-x64, exe: oxilite.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Volland/oxilite
          ref: ${{ inputs.oxilite_ref || 'main' }}
          path: oxilite
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - name: Build the server
        working-directory: oxilite
        run: cargo build --release -p oxilite-cli --target ${{ matrix.rust }}
      - name: Bundle the server
        shell: bash
        run: |
          mkdir -p bin
          cp oxilite/target/${{ matrix.rust }}/release/${{ matrix.exe }} bin/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: Test
        shell: bash
        run: OXILITE_BIN="$PWD/bin/${{ matrix.exe }}" npm test
      - run: node esbuild.mjs --production && npx vite build
      - run: npx vsce package --target ${{ matrix.vsce }} --out oxilite-studio-${{ matrix.vsce }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: oxilite-studio-${{ matrix.vsce }}
          path: oxilite-studio-${{ matrix.vsce }}.vsix

  # Publishes every platform VSIX to Open VSX when a `v*` tag is pushed.
  # Needs an `OVSX_PAT` repository secret and the `pavlyshyn` namespace created on open-vsx.org.
  publish-openvsx:
    needs: vsix
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: oxilite-studio-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for f in oxilite-studio-*.vsix; do
            npx --yes ovsx publish "$f" -p "$OVSX_PAT"
          done
